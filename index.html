<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Guard Creator Performance Dashboard</title>
<style>
:root {
  --page: #e9e9e7; --card: #f8f8f7; --card2: #efefed;
  --ink: #101010; --ink2: #4c4b48; --muted: #8a8880;
  --grid: #dcdbd6; --ring: rgba(16,16,16,0.09);
  --accent: #1c5cab; --line: #2a78d6;
  --up: #0a7d0a; --up-bg: rgba(12,163,12,0.12);
  --down: #c43434; --down-bg: rgba(208,59,59,0.10);
  --fb: #2a78d6; --ig: #e87ba4; --tt: #1baf7a;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 0 18px 70px; }
.wrap { max-width: 1500px; margin: 0 auto; }
header { padding: 26px 0 10px; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
h1 { font-size: 21px; margin: 0; letter-spacing: -0.01em; }
#status { font-size: 12px; color: var(--muted); }
#status.busy::before { content: "●"; color: var(--accent); margin-right: 5px; animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .25; } }
.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 6px 0 18px; }
.chip { font: 600 12.5px system-ui, sans-serif; color: var(--ink2); background: var(--card);
  border: 1px solid var(--ring); border-radius: 999px; padding: 6px 13px; cursor: pointer; }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip.active { background: var(--ink); color: var(--card); border-color: var(--ink); }
.custom { display: flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted);
  background: var(--card); border: 1px solid var(--ring); border-radius: 999px; padding: 3px 10px; }
.custom input[type=date] { border: none; background: transparent; font: 12.5px system-ui; color: var(--ink); }
.custom input[type=number] { width: 44px; border: none; background: transparent; font: 12.5px system-ui; color: var(--ink); }
.custom button { border: none; background: var(--ink); color: var(--card); border-radius: 999px;
  padding: 3px 10px; font: 600 12px system-ui; cursor: pointer; }
.meta { font-size: 12px; color: var(--muted); margin: -8px 0 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; }
.card { background: var(--card); border: 1px solid var(--ring); border-radius: 10px; padding: 14px 16px 12px; }
.card h2 { font-size: 15.5px; margin: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.rank { color: var(--muted); font-size: 12px; font-weight: 600; margin-right: 6px; }
.big { font-size: 23px; font-weight: 700; letter-spacing: -0.01em; margin: 2px 0 0; font-variant-numeric: tabular-nums; }
.nposts { font-size: 12.5px; font-weight: 500; color: var(--muted); margin-left: 8px; letter-spacing: 0;
  cursor: pointer; border-bottom: 1px dotted var(--ring); }
.nposts:hover { color: var(--ink2); }
.postchart { margin: 6px 0 2px; }
.postchart .pclabel { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  color: var(--muted); margin: 2px 0 3px; }
.pcwrap { position: relative; }
.delta { font-size: 12px; font-weight: 700; border-radius: 4px; padding: 1.5px 7px; }
.delta.up { color: var(--up); background: var(--up-bg); }
.delta.down { color: var(--down); background: var(--down-bg); }
.delta.flat { color: var(--muted); background: var(--card2); }
.spark { display: block; margin: 8px 0 4px; }
.toplist { margin: 8px 0 0; padding: 8px 0 0; border-top: 1px dashed var(--grid); }
.toplist summary { font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
  color: var(--muted); cursor: pointer; user-select: none; }
.tv { display: flex; gap: 8px; align-items: baseline; font-size: 12.5px; margin: 5px 0; }
.tv .g { font-weight: 700; min-width: 52px; text-align: right; font-variant-numeric: tabular-nums; }
.tv .cap { color: var(--ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.tv .cap a { color: inherit; text-decoration: none; }
.tv .cap a:hover { color: var(--accent); }
.pb { display: inline-block; font-size: 9.5px; font-weight: 700; padding: 1px 5px; border-radius: 3px; color: #fff; }
.pb.instagram { background: var(--ig); } .pb.facebook { background: var(--fb); } .pb.tiktok { background: var(--tt); }
.empty { color: var(--muted); font-size: 12.5px; }
#chips { margin-bottom: 0; }
#opts { margin: 8px 0 14px; }
.grp { display: inline-flex; align-items: center; gap: 5px; padding-right: 12px; margin-right: 2px; border-right: 1px solid var(--ring); }
.grp:last-of-type { border-right: none; }
.glabel { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-right: 3px; }
.fin { font: 500 12.5px system-ui, sans-serif; width: 88px; background: var(--card); border: 1px solid var(--ring);
  border-radius: 999px; padding: 3.5px 11px; color: var(--ink); }
.fin:focus { outline: 1.5px solid var(--ink2); }
.fcount { font-size: 11.5px; color: var(--muted); }
.termchip { font-size: 8.5px; font-weight: 800; letter-spacing: .07em; color: #fff; background: #a5a5a0;
  border-radius: 3px; padding: 2px 6px; margin-left: 8px; vertical-align: 2px; }
.card.terminated { opacity: .72; }
.card.onplan { background: #f3eefb; border-color: rgba(124, 77, 214, 0.25); }
.legend { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink2); font-weight: 600; }
.legend .sw { width: 13px; height: 13px; border-radius: 4px; background: #f3eefb; border: 1px solid rgba(124, 77, 214, 0.45); }
.total-strip { display: flex; align-items: baseline; gap: 10px; margin: 12px 0 0; }
.total-strip .tlabel { font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.total-strip .tbig { font-size: 32px; font-weight: 800; letter-spacing: -.5px; }
.covwarn { font-size: 12px; font-weight: 600; color: var(--down); max-width: 560px; }
.p-ig { color: var(--ig); } .p-fb { color: var(--fb); } .p-tt { color: var(--tt); }
.psplit { display: flex; gap: 8px; margin-top: 2px; font-size: 10.5px; font-weight: 700; }
.psplit span { cursor: default; }
.tsplit { display: inline-flex; gap: 9px; font-size: 12.5px; font-weight: 700; margin-left: 4px; }
.tsplit span { cursor: default; }
.sub { display: flex; align-items: center; gap: 5px; margin-top: 7px; }
.plink { font-size: 9.5px; font-weight: 700; padding: 2px 7px; border-radius: 3px; color: #fff; text-decoration: none; }
.plink.instagram { background: var(--ig); } .plink.facebook { background: var(--fb); } .plink.tiktok { background: var(--tt); }
.plink:hover { opacity: .75; }
.pay { margin-left: auto; font-size: 11.5px; font-weight: 600; color: var(--ink2);
  cursor: pointer; border-bottom: 1px dotted var(--ring); }
.pay.none { color: var(--muted); font-weight: 500; cursor: default; border-bottom: none; }
.pay.good { color: var(--up); }
.pay.bad { color: var(--down); }
.paypanel { margin: 7px 0 2px; padding: 7px 11px; background: var(--card2); border-radius: 7px; font-size: 12px; }
.paypanel .pr { display: flex; justify-content: space-between; gap: 10px; margin: 2.5px 0; color: var(--ink2); }
.paypanel .pr .val { font-variant-numeric: tabular-nums; font-weight: 600; }
.paypanel .pr b { color: var(--ink); }
.paypanel .muted { color: var(--muted); font-size: 11px; margin-top: 4px; }
.tv.pad .g, .tv.pad .cap { color: var(--muted); }
.tv.pad .g { font-weight: 600; }
.tv .dt { font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.sparkwrap { position: relative; }
#tt { position: fixed; z-index: 10; background: var(--ink); color: var(--card); font: 600 11px system-ui, sans-serif;
  padding: 3px 8px; border-radius: 5px; pointer-events: none; white-space: nowrap; display: none; }
.hoverdot { position: absolute; width: 7px; height: 7px; border-radius: 50%; background: var(--line);
  border: 1.5px solid var(--card); pointer-events: none; display: none; }
nav.tabs { display: flex; gap: 6px; margin: 4px 0 16px; border-bottom: 1px solid var(--grid); }
nav.tabs a { font: 600 13px system-ui, sans-serif; color: var(--ink2); text-decoration: none;
  padding: 8px 14px; border: 1px solid transparent; border-bottom: none; border-radius: 8px 8px 0 0;
  position: relative; top: 1px; }
nav.tabs a:hover { color: var(--accent); }
nav.tabs a.on { background: var(--card); border-color: var(--ring); border-bottom: 1px solid var(--card); color: var(--ink); }
#gate { position: fixed; inset: 0; background: var(--page); display: none; align-items: center; justify-content: center; z-index: 50; }
#gate .gbox { background: var(--card); border: 1px solid var(--ring); border-radius: 12px; padding: 28px 30px; width: 330px; }
#gate h2 { margin: 0 0 4px; font-size: 17px; }
#gate p { margin: 0 0 14px; color: var(--muted); font-size: 12.5px; }
#gatePw { width: 100%; font: 14px system-ui, sans-serif; padding: 9px 12px; border: 1px solid var(--grid); border-radius: 8px; background: var(--page); color: var(--ink); }
#gateGo { margin-top: 10px; width: 100%; font: 700 13.5px system-ui, sans-serif; background: var(--ink); color: var(--card); border: none; border-radius: 8px; padding: 10px; cursor: pointer; }
#gateErr { color: var(--down); font-size: 12px; min-height: 16px; margin-top: 8px; }
</style>
</head>
<body>
<div id="gate"><div class="gbox"><h2>Guard Creator Performance Dashboard</h2>
<p>Enter the team password to unlock.</p>
<input id="gatePw" type="password" placeholder="password" autocomplete="current-password">
<div id="gateErr"></div><button id="gateGo">Unlock</button></div></div>
<div class="wrap">
<header>
  <h1>Guard Creator Performance Dashboard</h1>
  <span id="status">loading…</span>
</header>
<nav class="tabs">
  <a href="#" class="on">Creator Performance</a>
  <a href="partnership.html">Partnership Ads</a>
</nav>
<div class="controls" id="chips">
  <button class="chip" data-days="1">Yesterday</button>
  <button class="chip" data-day-offset="2">2 days ago</button>
  <button class="chip" data-day-offset="3">3 days ago</button>
  <button class="chip" data-days="3">Last 3 days</button>
  <button class="chip active" data-days="7">Last 7 days</button>
  <button class="chip" data-days="10">Last 10 days</button>
  <button class="chip" data-days="14">Last 14 days</button>
  <button class="chip" data-days="21">Last 21 days</button>
  <button class="chip" data-days="30">Last 30 days</button>
  <button class="chip" data-cal="last-month">Last month</button>
  <span class="custom">last <input type="number" id="ndays" min="1" max="120" value="5"> days
    <button id="goN">Go</button></span>
  <span class="custom"><input type="date" id="d0"> → <input type="date" id="d1">
    <button id="goRange">Go</button></span>
</div>
<div class="controls" id="opts">
  <span class="grp"><span class="glabel">Counting</span>
    <button class="chip active" data-mode="all" title="Views gained during the window by the whole catalog — old videos still pulling count too">All videos</button>
    <button class="chip" data-mode="new" title="Views to date on videos POSTED within the window — the monthly report counts this way">Posted in period</button></span>
  <span class="grp"><span class="glabel">Sort</span>
    <button class="chip active" data-sort="total" id="sortViews">Views</button>
    <button class="chip" data-sort="trend" id="sortTrend">Trend</button></span>
  <span class="grp"><span class="glabel">Min commissions</span>
    <button class="chip" data-comm="500">$500</button>
    <button class="chip" data-comm="750">$750</button>
    <button class="chip" data-comm="1000">$1,000</button>
    <input class="fin" id="commMin" placeholder="custom $" inputmode="decimal"></span>
  <span class="grp"><span class="glabel">Min views</span>
    <input class="fin" id="viewsMin" placeholder="e.g. 1m / 500k"></span>
  <span class="grp"><button class="chip" id="hideTerm" title="Terminated status synced from the Notion roster on every refresh">Hide terminated</button></span>
  <button class="chip" id="exportCsv" title="Excel with 3 tabs: creator summary + pay breakdown, every window video with views & links, and posting-per-day matrix. Respects window, counting mode, filters and sorting.">⬇ Export Excel</button>
  <button class="chip" id="clearF" hidden>✕ Clear filters</button>
  <span class="fcount" id="fcount"></span>
  <span class="legend"><span class="sw"></span> = on the Next-30 plan</span>
</div>
<div class="total-strip" id="totals"></div>
<div class="meta" id="meta"></div>
<div class="grid" id="grid"></div>
</div>
<script src="xlsx.full.min.js"></script>
<script>
let BUNDLE = null;
let CORE = null;
let curView = { chip: "last7" };
const $ = s => document.querySelector(s);
const fmt = v => v >= 1e6 ? (v/1e6).toFixed(v >= 1e7 ? 1 : 2) + "M" : v >= 1e3 ? Math.round(v/1e3) + "k" : "" + Math.round(v);
let DATA = null;
let RENDERED = [];
let sortMode = "total";
let countMode = "all";
let commMin = 0, viewsMin = 0, hideTerm = false;

function parseAmt(s) {
  s = (s || "").trim().toLowerCase().replace(/[$,\s]/g, "");
  if (!s) return 0;
  let mult = 1;
  if (s.endsWith("m")) { mult = 1e6; s = s.slice(0, -1); }
  else if (s.endsWith("k")) { mult = 1e3; s = s.slice(0, -1); }
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n * mult;
}

function isoDaysAgo(n) { const d = new Date(); d.setDate(d.getDate() - n); return d.toISOString().slice(0, 10); }

function fetchSummary(key) {
  if (key) curView = { chip: key };
  if (!BUNDLE || !curView.chip) return;
  DATA = BUNDLE.windows[curView.chip + "_" + countMode] || null;
  render();
}
function refreshView() {
  if (curView.custom) showCustom(curView.custom[0], curView.custom[1]);
  else fetchSummary();
}

function spark(days, w, h) {
  if (!days.length) return "";
  const max = Math.max(...days, 1);
  const step = days.length > 1 ? w / (days.length - 1) : w;
  const pts = days.map((v, i) => `${(i * step).toFixed(1)},${(h - 4 - (h - 10) * v / max).toFixed(1)}`);
  const lastX = ((days.length - 1) * step).toFixed(1);
  const lastY = (h - 4 - (h - 10) * days[days.length - 1] / max).toFixed(1);
  const single = days.length === 1;
  return `<svg class="spark" width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polygon points="0,${h-3} ${pts.join(" ")} ${lastX},${h-3}" fill="var(--line)" opacity="0.10"/>
    <polyline points="${pts.join(" ")}" fill="none" stroke="var(--line)" stroke-width="2" ${single ? 'stroke-linecap="round"' : ""}/>
    <circle cx="${lastX}" cy="${lastY}" r="3" fill="var(--line)"/>
  </svg>`;
}

function render() {
  if (!DATA || !DATA.cards) { $("#grid").innerHTML = `<div class="empty">${DATA && DATA.error || "no data"}</div>`; return; }
  let cards = [...DATA.cards];
  if (hideTerm) cards = cards.filter(c => !c.term);
  if (commMin > 0) cards = cards.filter(c => c.paid_detail && c.paid_detail.commission >= commMin);
  if (viewsMin > 0) cards = cards.filter(c => c.total >= viewsMin);
  if (sortMode === "trend") cards.sort((a, b) => {
    const ta = a.prev > 1000 ? a.total / a.prev : (a.total > 1000 ? 9e9 : 0);
    const tb = b.prev > 1000 ? b.total / b.prev : (b.total > 1000 ? 9e9 : 0);
    return tb - ta;
  });
  RENDERED = cards;
  const filtering = commMin > 0 || viewsMin > 0 || hideTerm;
  $("#fcount").textContent = filtering ? `${cards.length} of ${DATA.cards.length} creators shown` : "";
  $("#clearF").hidden = !filtering;
  if (DATA.totals) {
    const tp = DATA.totals.prev > 1000 ? (DATA.totals.total / DATA.totals.prev - 1) * 100 : null;
    const tcls = tp === null ? "flat" : tp >= 5 ? "up" : tp <= -5 ? "down" : "flat";
    const ttxt = tp === null ? "—" : (tp >= 0 ? "▲ +" : "▼ ") + Math.abs(tp).toFixed(0) + "%";
    const cohort = DATA.mode === "new";
    const tl = cohort
      ? `<span class="tlabel" title="Views to date on videos POSTED within this window — the monthly report counts this way. Recent cohorts are still accruing, so they read low at first.">Views on videos posted · ${DATA.start} → ${DATA.end}</span>`
      : `<span class="tlabel" title="Views gained during this window by the WHOLE catalog — old videos still pulling count too. Switch to 'Posted in period' for the monthly-report-style count.">Total views · ${DATA.start} → ${DATA.end}</span>`;
    const preCov = !cohort && DATA.coverage && DATA.start < DATA.coverage.first;
    const goal = "";
    let tsplit = "";
    const tp2 = DATA.totals_plat;
    if (tp2) {
      const s2 = tp2[0] + tp2[1] + tp2[2];
      if (s2 > 0) tsplit = `<span class="tsplit">` +
        [["p-ig", "IG", tp2[0]], ["p-fb", "FB", tp2[1]], ["p-tt", "TT", tp2[2]]].filter(x => Math.round(x[2] / s2 * 100) >= 1)
          .map(([cl, lb, v]) => `<span class="${cl}" title="${lb} ${fmt(v)} views">${lb} ${Math.round(v / s2 * 100)}%</span>`).join("") + `</span>`;
    }
    $("#totals").innerHTML = tl +
      `<span class="tbig">${fmt(DATA.totals.total)}</span>` +
      `<span class="delta ${tcls}" title="vs previous equal window (${fmt(DATA.totals.prev)})">${ttxt}</span>` + tsplit + goal +
      (preCov ? `<span class="covwarn">⚠ daily view tracking only exists from ${DATA.coverage.first} — for months before that, switch to “Posted in period” (counts by upload date)</span>` : "");
  }
  $("#meta").textContent = `${DATA.start} → ${DATA.end} · data coverage ${DATA.coverage.first} → ${DATA.coverage.last}` +
    ` · top-video gains: ${DATA.video_gains.exact ? "exact (" + DATA.video_gains.label + ")" : DATA.video_gains.label}` +
    (DATA.last_refresh ? ` · last refresh ${DATA.last_refresh.replace("T", " ")}` : "");
  const PB = {instagram: "IG", facebook: "FB", tiktok: "TT"};
  $("#grid").innerHTML = cards.map((c, i) => {
    const pct = c.prev > 1000 ? (c.total / c.prev - 1) * 100 : null;
    const dcls = pct === null ? "flat" : pct >= 5 ? "up" : pct <= -5 ? "down" : "flat";
    const dtxt = pct === null ? (c.total > 0 ? "new" : "—")
      : (pct >= 0 ? "▲ +" : "▼ ") + Math.abs(pct).toFixed(0) + "%";
    const links = ["instagram", "tiktok", "facebook"].flatMap(p => ((c.links || {})[p] || []).map(a =>
      `<a class="plink ${p}" href="${a.url}" target="_blank" rel="noopener" title="@${a.u}">${PB[p]}</a>`)).join("");
    const np = (c.posts && c.posts.videos) || 0;
    const npDetail = (np ? `unique videos posted in selected period (cross-posts counted once) · platform posts: ` +
      ["instagram", "facebook", "tiktok"].filter(p => c.posts[p]).map(p => `${PB[p]} ${c.posts[p]}`).join(" · ")
      : "no posts in selected period") + " — click for posting history";
    const nposts = `<span class="nposts" data-key="${c.key}" title="${npDetail}">· ${np} ${np === 1 ? "video" : "videos"}</span>`;
    const pd = c.paid_detail;
    const payCls = pd ? (pd.commission >= 500 ? " good" : " bad") : "";
    const pay = c.paid != null
      ? `<span class="pay${payCls}" title="click for earnings breakdown">${DATA.paid_label} pay $${Math.round(c.paid).toLocaleString()}</span>`
      : `<span class="pay none">${DATA.paid_label} pay —</span>`;
    const isCohort = DATA.mode === "new";
    const top = c.top.length ? c.top.map(v => {
      const cap = v.l ? `<a href="${v.l}" target="_blank" rel="noopener" title="posted ${v.u} · total ${fmt(v.v)}">${(v.t || "(no caption)").replace(/</g, "&lt;")}</a>`
                      : (v.t || "(no caption)").replace(/</g, "&lt;");
      const g = isCohort ? `<span class="g" title="views to date">${fmt(v.v)}</span>`
        : v.pad ? `<span class="g" title="no measured gain in this window — total views shown">${fmt(v.v)}</span>`
                : `<span class="g">+${fmt(v.g)}</span>`;
      return `<div class="tv${v.pad ? " pad" : ""}">${g}<span class="pb ${v.p}">${PB[v.p] || v.p}</span>
       <span class="cap">${cap}</span><span class="dt">${v.u ? v.u.slice(5) : ""}</span></div>`;
    }).join("") : `<div class="empty" style="margin-top:5px;">${isCohort ? "nothing posted in this period" : "no videos tracked"}</div>`;
    return `<div class="card${c.term ? " terminated" : ""}${c.plan ? " onplan" : ""}"${c.plan ? ' title="on the Next-30 plan"' : ""}>
      <h2><span><span class="rank">#${i + 1}</span>${c.name}${c.term ? '<span class="termchip">TERMINATED</span>' : ""}</span><span class="delta ${dcls}" title="vs previous equal window">${dtxt}</span></h2>
      <div class="sub">${links}${pay}</div>
      <div class="paypanel" hidden></div>
      <div class="big">${fmt(c.total)}${nposts}</div>
      ${(() => { const pl = c.plat || [0, 0, 0]; const ps = pl[0] + pl[1] + pl[2];
        return ps > 0 ? `<div class="psplit">` +
          [["p-ig", "IG", pl[0]], ["p-fb", "FB", pl[1]], ["p-tt", "TT", pl[2]]].filter(x => Math.round(x[2] / ps * 100) >= 1)
            .map(([cl, lb, v]) => `<span class="${cl}" title="${lb} ${fmt(v)} views">${lb} ${Math.round(v / ps * 100)}%</span>`).join("") + `</div>` : ""; })()}
      <div class="sparkwrap" data-i="${i}">${spark(c.days, 300, 54)}</div>
      <div class="postchart" hidden></div>
      <details class="toplist"><summary>${isCohort ? "Top videos posted in period" : "Top videos · gainers first"}</summary>${top}</details>
    </div>`;
  }).join("");
}

// posting chart for the SELECTED period (click the "N videos" count)
function postChart(days, dates) {
  if (!days.length) return '<div class="empty">no data</div>';
  const W = 300, H = 78, base = 60, top = 6;
  const step = W / days.length;
  const ymax = Math.max(...days.map(x => x.n), 1);
  let bars = "", labels = "";
  const every = Math.max(1, Math.ceil(days.length / 6));
  days.forEach((x, i) => {
    if (x.n) {
      const h = (base - top) * x.n / ymax;
      bars += `<rect x="${(i * step + 0.5).toFixed(1)}" y="${(base - h).toFixed(1)}" width="${Math.max(step - 1.5, 0.8).toFixed(1)}" height="${h.toFixed(1)}" rx="1" fill="var(--line)" opacity="0.55"/>`;
    }
    if (i % every === 0) {
      labels += `<text x="${(i * step + 1).toFixed(1)}" y="${H - 4}" font-size="8.5" fill="var(--muted)">${dates[i].slice(5)}</text>`;
    }
  });
  return `<div class="pclabel">Videos posted per day · this period (max ${ymax})</div>
    <div class="pcwrap"><svg width="100%" viewBox="0 0 ${W} ${H}">
      <line x1="0" x2="${W}" y1="${base + 0.5}" y2="${base + 0.5}" stroke="var(--ring)"/>
      ${bars}${labels}</svg></div>`;
}

// ---- client-side analytics over CORE: any custom date window ----
const PNAME = ["instagram", "facebook", "tiktok"];
function isoAdd(d, n) { const x = new Date(d + "T00:00:00Z"); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); }
function normTitle(t) { return (t || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim(); }
function byCreator() {
  if (!CORE._by) { CORE._by = CORE.creators.map(() => []); CORE.videos.forEach((v, i) => CORE._by[v.c].push(i)); }
  return CORE._by;
}
function postsFor(key, winDays) {
  const src = (CORE.posts || {})[key] || {};
  let videos = 0, ig = 0, fb = 0, tt = 0;
  const days = winDays.map(d => {
    const e = src[d] || [0, 0, 0];
    ig += e[0]; fb += e[1]; tt += e[2];
    const n = Math.max(e[0], e[1], e[2]);
    videos += n;
    return { n, ig: e[0], fb: e[1], tt: e[2] };
  });
  return { days, agg: { videos, instagram: ig, facebook: fb, tiktok: tt, total: ig + fb + tt } };
}
function cardShell(cr, total, prev, daily, top, winDays, plat) {
  const pf = postsFor(cr.key, winDays);
  return { key: cr.key, name: cr.name, total, prev, days: daily, top,
           posts: pf.agg, posts_days: pf.days, term: cr.term,
           plat: (plat || [0, 0, 0]).map(Math.round),
           links: cr.links || {}, paid: cr.paid, paid_detail: cr.paid_detail };
}
function topFill(list, ci) {
  const seen = new Set(list.map(r => r[2]));
  if (list.length < 10) {
    const rec = byCreator()[ci].slice().sort((a, b) => (CORE.videos[b].u || "").localeCompare(CORE.videos[a].u || ""));
    for (const i of rec) {
      if (seen.has(i)) continue;
      list.push([0, CORE.videos[i].v, i, true]);
      if (list.length >= 10) break;
    }
  }
  return list.map(([g, vv, i, pad]) => {
    const v = CORE.videos[i];
    const row = { g: Math.round(g), v: vv, t: v.t, l: v.l, p: PNAME[v.p], u: v.u };
    if (pad) row.pad = true;
    return row;
  });
}
function cohortCompute(start, end) {
  const C = CORE;
  const groups = C.creators.map(() => new Map());
  const singles = C.creators.map(() => []);
  C.videos.forEach((v, i) => {
    if (!v.u || v.u < start || v.u > end) return;
    const nt = normTitle(v.t);
    if (nt) { const m = groups[v.c]; if (!m.has(nt)) m.set(nt, []); m.get(nt).push(i); }
    else singles[v.c].push(i);
  });
  return C.creators.map((cr, ci) => {
    let total = 0; const byDay = {}; const plat = [0, 0, 0];
    const addCluster = items => {
      let ig = 0, fb = 0, tt = 0, d0 = null;
      items.forEach(i => {
        const v = C.videos[i];
        if (v.p === 0) ig += v.v; else if (v.p === 1) fb += v.v; else tt += v.v;
        if (d0 === null || v.u < d0) d0 = v.u;
      });
      total += Math.max(ig, fb) + tt;
      plat[0] += Math.max(0, ig - fb); plat[1] += fb; plat[2] += tt;
      byDay[d0] = (byDay[d0] || 0) + Math.max(ig, fb) + tt;
    };
    groups[ci].forEach(items => {
      items.sort((a, b) => C.videos[a].u.localeCompare(C.videos[b].u));
      let bucket = [items[0]];
      for (let k = 1; k < items.length; k++) {
        const gap = (new Date(C.videos[items[k]].u) - new Date(C.videos[bucket[0]].u)) / 864e5;
        if (gap <= 3) bucket.push(items[k]); else { addCluster(bucket); bucket = [items[k]]; }
      }
      addCluster(bucket);
    });
    singles[ci].forEach(i => addCluster([i]));
    return { total, byDay, plat };
  });
}
function buildCustom(start, end, mode) {
  const C = CORE;
  if (!C) return null;
  if (start > end) { const t = start; start = end; end = t; }
  const winDays = C.all_days.filter(d => d >= start && d <= end);
  const n = Math.max(1, winDays.length);
  const prevEnd = isoAdd(start, -1), prevStart = isoAdd(start, -n);
  const todayIso = new Date().toISOString().slice(0, 10);
  const cards = [];
  let gainsLabel, exact = false;

  if (mode === "new") {
    gainsLabel = "views to date on videos posted in the period";
    const cur = cohortCompute(start, end);
    const prv = cohortCompute(prevStart, prevEnd);
    C.creators.forEach((cr, ci) => {
      const daily = winDays.map(d => Math.round(cur[ci].byDay[d] || 0));
      const top = byCreator()[ci].filter(i => { const u = C.videos[i].u; return u >= start && u <= end; })
        .sort((a, b) => C.videos[b].v - C.videos[a].v).slice(0, 10)
        .map(i => { const v = C.videos[i]; return { g: v.v, v: v.v, t: v.t, l: v.l, p: PNAME[v.p], u: v.u }; });
      cards.push(cardShell(cr, Math.round(cur[ci].total), Math.round(prv[ci].total), daily, top, winDays, cur[ci].plat));
    });
  } else {
    const gainsBy = C.creators.map(() => []);
    const exactOk = C.snap_first && start >= C.snap_first && end < C.snap_last;
    if (exactOk) {
      exact = true;
      gainsLabel = start + " \u2192 " + isoAdd(end, 1) + " snapshots";
      const per = new Map();
      winDays.forEach(d => { const g = C.daygains[d]; if (g) for (const k in g) { const i = +k; per.set(i, (per.get(i) || 0) + g[k]); } });
      per.forEach((g, i) => { if (g > 0) gainsBy[C.videos[i].c].push([g, C.videos[i].v, i]); });
    } else {
      const span = n <= 1 ? "i1" : n <= 7 ? "i7" : n <= 14 ? "i14" : "i30";
      gainsLabel = "approximated from Shortimize " + ({ i1: "last 1 day", i7: "last 7 days", i14: "last 14 days", i30: "last 30 days" })[span] + " growth";
      const recentEnd = end >= isoAdd(todayIso, -2);
      C.videos.forEach((v, i) => {
        if (!v.v) return;
        if (recentEnd && v.u && v.u >= start) { gainsBy[v.c].push([v.v, v.v, i]); return; }
        const inc = v[span];
        if (inc && inc > 0) { const g = v.v * inc / (100 + inc); if (g > 0) gainsBy[v.c].push([g, v.v, i]); }
      });
    }
    C.creators.forEach((cr, ci) => {
      const s = C.series[cr.key] || {};
      const daily = winDays.map(d => Math.round(s[d] || 0));
      const total = daily.reduce((a, b) => a + b, 0);
      let prev = 0;
      for (const d in s) if (d >= prevStart && d <= prevEnd) prev += s[d];
      const top = topFill(gainsBy[ci].sort((a, b) => b[0] - a[0]).slice(0, 10), ci);
      const sp = (C.series_plat || {})[cr.key] || {};
      const plat = [0, 0, 0];
      winDays.forEach(d => { const t = sp[d]; if (t) { plat[0] += t[0]; plat[1] += t[1]; plat[2] += t[2]; } });
      cards.push(cardShell(cr, total, Math.round(prev), daily, top, winDays, plat));
    });
  }

  cards.sort((a, b) => b.total - a.total);
  const totals = { total: cards.reduce((a, c) => a + c.total, 0), prev: cards.reduce((a, c) => a + c.prev, 0) };
  const totals_plat = [0, 1, 2].map(i => cards.reduce((a, c) => a + (c.plat ? c.plat[i] : 0), 0));
  return { days: winDays, start, end, cards, totals, totals_plat, mode, paid_label: C.paid_label,
           coverage: { first: C.all_days[0], last: C.all_days[C.all_days.length - 1] },
           video_gains: { exact, label: gainsLabel }, last_refresh: BUNDLE.generated_at };
}
function showCustom(start, end) {
  curView = { custom: [start, end] };
  DATA = buildCustom(start, end, countMode);
  render();
}

// password gate: bundle.enc is zlib-compressed JSON inside AES-256-GCM
async function decryptBundle(pw) {
  const buf = new Uint8Array(await (await fetch("bundle.enc?v=" + Date.now())).arrayBuffer());
  const salt = buf.slice(0, 16), iv = buf.slice(16, 28), ct = buf.slice(28);
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: 250000, hash: "SHA-256" },
    km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct);
  const ds = new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("deflate")));
  return JSON.parse(await ds.text());
}
async function unlock(pw) {
  try { BUNDLE = await decryptBundle(pw); } catch (e) { return false; }
  CORE = BUNDLE.core || null;
  try { localStorage.setItem("gcpd_pw", pw); } catch (e) {}
  $("#gate").style.display = "none";
  $("#status").innerHTML = "data as of " + BUNDLE.generated_at +
    ' \u00b7 auto-refreshes every 4h \u00b7 <a href="https://github.com/Guard-Internal/creator-dashboard/actions/workflows/refresh.yml" target="_blank" rel="noopener">force refresh</a>';
  fetchSummary("last7");
  return true;
}
async function boot() {
  let pw = null;
  try { pw = localStorage.getItem("gcpd_pw"); } catch (e) {}
  if (pw && await unlock(pw)) return;
  $("#gate").style.display = "flex";
  $("#gateGo").addEventListener("click", async () => {
    $("#gateErr").textContent = "";
    if (!(await unlock($("#gatePw").value.trim()))) $("#gateErr").textContent = "wrong password";
  });
  $("#gatePw").addEventListener("keydown", e => { if (e.key === "Enter") $("#gateGo").click(); });
}

boot();
